name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Infrastructure
        id: deploy_infra
        run: |
          echo "Deploying Azure infrastructure (non-destructive, incremental mode)..."
          az deployment group create \
            --resource-group rg-green-squirrel \
            --template-file infrastructure/main.bicep \
            --parameters environmentName=prod \
            --mode Incremental \
            --query 'properties.outputs' \
            --output json > deployment-outputs.json

          echo "Infrastructure deployment complete"
          cat deployment-outputs.json

      - name: Get Static Web App Deployment Token
        id: get_token
        run: |
          DEPLOYMENT_TOKEN=$(az staticwebapp secrets list \
            --name hive-reader-web-prod \
            --resource-group rg-green-squirrel \
            --query "properties.apiKey" \
            --output tsv)
          echo "::add-mask::$DEPLOYMENT_TOKEN"
          echo "DEPLOYMENT_TOKEN=$DEPLOYMENT_TOKEN" >> $GITHUB_OUTPUT

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.get_token.outputs.DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/web"
          api_location: ""
          output_location: "dist"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Static Web App Deployment Token
        id: get_token
        run: |
          DEPLOYMENT_TOKEN=$(az staticwebapp secrets list \
            --name hive-reader-web-prod \
            --resource-group rg-green-squirrel \
            --query "properties.apiKey" \
            --output tsv)
          echo "::add-mask::$DEPLOYMENT_TOKEN"
          echo "DEPLOYMENT_TOKEN=$DEPLOYMENT_TOKEN" >> $GITHUB_OUTPUT

      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.get_token.outputs.DEPLOYMENT_TOKEN }}
          action: "close"
